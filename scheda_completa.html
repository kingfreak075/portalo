<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheda impianto</title>
  <style>
    :root{--bg:#eef3f0;--surface:#fff;--soft:#f7faf8;--text:#18251e;--muted:#67736b;--line:#dfe8e2;--primary:#197a47;--primary-dark:#105c35;--primary-soft:#e8f5ed;--blue:#1769aa;--blue-soft:#e9f3fb;--warning:#9a6700;--warning-soft:#fff6da;--danger:#b42318;--danger-soft:#fff0ee;--shadow:0 12px 35px rgba(24,55,38,.10);--radius:17px}
    body.dark-theme{--bg:#101713;--surface:#17211b;--soft:#1d2922;--text:#edf5ef;--muted:#a9b8ae;--line:#304239;--primary:#73d69c;--primary-dark:#a2e8bc;--primary-soft:#203b2b;--blue:#75bdf1;--blue-soft:#203445;--warning:#f2c55c;--warning-soft:#3b321d;--danger:#ff9b92;--danger-soft:#3d2422;--shadow:0 12px 35px rgba(0,0,0,.32)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-width:320px;background:linear-gradient(180deg,var(--bg),#f7faf8 42%,var(--bg));color:var(--text);font-family:"Segoe UI",Arial,sans-serif;line-height:1.45} body.dark-theme{background:var(--bg)} button,a{font:inherit}.shell{width:min(1440px,calc(100% - 32px));margin:24px auto 48px}
    .hero{position:relative;overflow:hidden;padding:28px;border-radius:22px;background:linear-gradient(135deg,#0d4d31,#197a47 55%,#2d9b62);color:#fff;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:330px;height:330px;right:-100px;top:-180px;border:52px solid rgba(255,255,255,.08);border-radius:50%}.hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow{margin:0 0 6px;color:rgba(255,255,255,.72);font-size:.77rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.05;letter-spacing:-.04em}.subtitle{margin:12px 0 0;color:rgba(255,255,255,.88);font-size:1rem}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;padding:9px 14px;border:1px solid rgba(255,255,255,.28);border-radius:11px;background:rgba(255,255,255,.11);color:#fff;text-decoration:none;cursor:pointer;transition:.2s}.btn:hover{background:rgba(255,255,255,.21);transform:translateY(-1px)}.btn svg{width:18px;height:18px;fill:currentColor}.facts{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:25px}.fact{min-width:0;padding:14px 16px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(255,255,255,.10)}.fact-label{display:block;margin-bottom:3px;color:rgba(255,255,255,.67);font-size:.73rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.fact-value{display:block;overflow-wrap:anywhere;font-weight:700}
    .interventions{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:19px 0;padding:17px 19px;border:1px solid #cfe2f2;border-radius:15px;background:var(--blue-soft);box-shadow:0 4px 15px rgba(23,105,170,.06)}.interventions-main{display:flex;align-items:center;gap:13px}.round-icon{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(23,105,170,.10)}body.dark-theme .round-icon{background:#172b39}.interventions h2{margin:0;font-size:1rem}.interventions p{margin:2px 0 0;color:var(--muted);font-size:.82rem}.count{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 9px;border-radius:999px;background:var(--blue);color:#fff;font-size:.82rem;font-weight:800}.interventions-link{color:var(--blue);text-decoration:none;font-weight:700}.disabled{color:var(--muted);font-size:.86rem}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}.card{grid-column:span 6;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:0 5px 18px rgba(16,40,25,.05)}.card.wide{grid-column:1/-1}.card-header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--soft))}.card-icon{display:grid;place-items:center;width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:var(--primary-soft);color:var(--primary)}.card-icon svg{width:20px;height:20px;fill:currentColor}.card h2{margin:0;font-size:1rem}.card-header p{margin:2px 0 0;color:var(--muted);font-size:.79rem}.fields{margin:0;padding:4px 20px 10px}.row{display:grid;grid-template-columns:minmax(150px,42%) minmax(0,1fr);gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row dt{color:var(--muted);font-size:.86rem}.row dd{margin:0;overflow-wrap:anywhere;text-align:right;font-size:.91rem;font-weight:650}.row dd.empty{color:#98a2b3;font-style:italic;font-weight:500}.row a{color:var(--primary);text-decoration:none}.row a:hover{text-decoration:underline}.note{margin:18px;padding:17px;border-left:4px solid var(--primary);border-radius:11px;background:var(--primary-soft);white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font-size:.82rem;font-weight:750}.tag:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.tag.no{background:var(--danger-soft);color:var(--danger)}.error{display:none;padding:24px;border:1px solid #f6c7c2;border-radius:var(--radius);background:var(--danger-soft);color:var(--danger)}.footer{margin-top:21px;color:var(--muted);font-size:.78rem;text-align:center}
    @media(max-width:900px){.hero-top{flex-direction:column}.actions{justify-content:flex-start}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.card{grid-column:1/-1}}@media(max-width:560px){.shell{width:calc(100% - 18px);margin-top:10px}.hero{padding:21px 18px;border-radius:17px}.actions{width:100%}.btn{flex:1 1 125px}.facts{grid-template-columns:1fr}.interventions{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr;gap:4px}.row dd{text-align:left}.card-header,.fields{padding-left:16px;padding-right:16px}}
    @media print{body{background:#fff}.shell{width:100%;margin:0}.hero{background:#fff;color:#111;border:1px solid #bbb;box-shadow:none}.hero:after,.actions,.footer{display:none}.subtitle,.eyebrow,.fact-label{color:#555}.fact{background:#fff;border-color:#ccc}.interventions,.card{break-inside:avoid;box-shadow:none}.grid{display:block}.card{margin-top:13px}}
  </style>
</head>
<body>
<main class="shell">
  <section id="content" hidden>
    <header class="hero">
      <div class="hero-top">
        <div><p class="eyebrow">Scheda completa impianto</p><h1 id="title">Impianto</h1><p id="subtitle" class="subtitle"></p></div>
        <div class="actions">
          <a id="emailButton" class="btn" href="#" title="Apri un nuovo messaggio email"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>Email</a>
          <button class="btn" type="button" onclick="window.print()">🖨 Stampa</button>
          <button class="btn" type="button" onclick="toggleTheme()">◐ Tema</button>
          <a class="btn" href="javascript:history.back()">← Indietro</a>
        </div>
      </div>
      <div class="facts">
        <div class="fact"><span class="fact-label">Impianto</span><span id="factImpianto" class="fact-value"></span></div>
        <div class="fact"><span class="fact-label">Tipo</span><span id="factTipo" class="fact-value"></span></div>
        <div class="fact"><span class="fact-label">Tecnico</span><span id="factTecnico" class="fact-value"></span></div>
        <div class="fact"><span class="fact-label">Contratto</span><span id="factContratto" class="fact-value"></span></div>
      </div>
    </header>
    <section id="interventiSection" class="interventions">
      <div class="interventions-main"><div class="round-icon">🛠</div><div><h2>Interventi effettuati <span id="interventiCount" class="count">0</span></h2><p>Storico registrato localmente per questo impianto</p></div></div>
      <div id="interventiLinkContainer"></div>
    </section>
    <div id="cards" class="grid"></div>
    <p class="footer">I dati visualizzati provengono dal parametro “impianto” presente nel collegamento.</p>
  </section>
  <section id="error" class="error" role="alert"><h2>Impossibile visualizzare l’impianto</h2><p id="errorText"></p></section>
</main>
<script>
const EMPTY='Non disponibile';let data={},used=new Set(),keyMap=new Map();
function toggleTheme(){document.body.classList.toggle('dark-theme');localStorage.setItem('schedaTheme',document.body.classList.contains('dark-theme')?'dark':'light')}
if(localStorage.getItem('schedaTheme')==='dark')document.body.classList.add('dark-theme');
function norm(v){return String(v??'').replace(/\r\n|\r|\n/g,' ').replace(/[_\s]+/g,' ').trim().toLocaleLowerCase('it-IT')}
function buildMap(){Object.keys(data).forEach(k=>keyMap.set(norm(k),k))}
function keyOf(aliases){for(const a of aliases){if(Object.prototype.hasOwnProperty.call(data,a))return a;const k=keyMap.get(norm(a));if(k!==undefined)return k}return null}
function raw(aliases,mark=true){const k=keyOf(aliases);if(k===null)return null;if(mark)used.add(k);return data[k]}
function empty(v){return v===null||v===undefined||String(v).trim()===''||String(v).trim()==='0'&&false}
function display(v){return empty(v)||String(v).trim()===''?EMPTY:String(v).replace(/\s+/g,' ').trim()}
function excelDate(v){if(empty(v)||Number(v)<=0)return EMPTY;const n=Number(v);if(!Number.isFinite(n))return display(v);const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}).format(d)}
function compactDate(v){if(empty(v)||Number(v)===0)return EMPTY;const s=String(v).trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(s))return s;const digits=s.replace(/\D/g,'');if(digits.length<7||digits.length>8)return display(v);const year=digits.slice(-4),head=digits.slice(0,-4);let day,month;if(head.length===4){day=head.slice(0,2);month=head.slice(2)}else{day=head.slice(0,1);month=head.slice(1)}return `${day.padStart(2,'0')}/${month.padStart(2,'0')}/${year}`}
function euro(v){if(empty(v))return EMPTY;const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n):display(v)}
function yesNo(v){const s=String(v??'').trim().toUpperCase();if(['S','SI','SÌ','Y','YES','TRUE'].includes(s))return'Sì';if(['N','NO','FALSE'].includes(s))return'No';return display(v)}
function getInterventiForImpianto(codice){try{const stored=localStorage.getItem(`interventi_${codice}`);if(stored){const parsed=JSON.parse(stored);return Array.isArray(parsed)?parsed:[]}}catch(e){console.warn('Impossibile recuperare interventi:',e)}return[]}
const icons={plant:'🏢',maintenance:'🔧',client:'👤',admin:'🏛',contract:'📄',commercial:'💼',contacts:'☎',fiscal:'🧾',radio:'📡',note:'📝',other:'☰'};
const sections=[
 {title:'Impianto',sub:'Identificazione e organizzazione operativa',icon:'plant',fields:[['Codice impianto',['impianto']],['Tipo cliente',['tipo cliente','tipo_cliente']],['Tipo impianto',['tipo impianto']],['TIID impianto',['TIID_IMPIANTO']],['Stato contratto',['stato ctr']],['Zona',['zona']],['Giro',['giro']],['Progressivo giro',['prog giro']],['Tecnico',['tecnico']],['Matricola',['matricola']],['Quantità impianti',['qta imp']],['Stagionale',['stagionale']]]},
 {title:'Manutenzione e verifiche',sub:'Scadenze e ultime attività',icon:'maintenance',fields:[['Tipo manutenzione',['manut']],['Periodicità (giorni)',['periodicità']],['Mese semestrale',['mese sem']],['Ultima semestrale',['ult sem'],'excel'],['Ultima manutenzione',['ult man'],'excel'],['Ultima verifica periodica',['utl vp'],'excel'],['Ente',['Ente']],['Ente 2',['Ente2']],['Mese fossa',['mese fossa']],['Frequenza fossa',['freq fossa']],['Ultima fossa',['ult fossa'],'excel']]},
 {title:'Cliente',sub:'Intestazione e ubicazione',icon:'client',fields:[['Cliente',['Cliente']],['Indirizzo cliente',['Indirizzo Cliente']],['Città cliente',['Città cliente']],['Provincia cliente',['Prov Cliente']],['Email cliente',['email cliente'],'email']]},
 {title:'Amministratore',sub:'Riferimenti dello studio amministrativo',icon:'admin',fields:[['Codice amministratore',['codice amm']],['Amministratore',['Amministratore']],['Indirizzo',['Indirizzo Amm']],['CAP',['Cap Amm']],['Città',['Citta amm']],['Provincia',['Prov Amm']],['Telefono',['tel amm'],'phone'],['Fax',['fax amm'],'phone'],['Email',['email amm','aa'],'email'],['Note amministratore',['note amm']]]},
 {title:'Contratto e canoni',sub:'Durata, fatturazione e valori',icon:'contract',fields:[['Contratto',['contratto']],['Inizio contratto',['inizio cont'],'compact'],['Fine contratto',['fine contratto'],'compact'],['Scadenza definitiva',['scad def'],'compact'],['Canone contratto',['Canone contratto'],'euro'],['Canone impianto',['Canone impianto'],'euro'],['Periodo fatturazione (mesi)',['periodo fatt']],['Ultima fatturazione',['ult fatt'],'excel'],['Reperibilità 24h',['rep24h'],'yesno'],['Valore 24h',['val_24h'],'euro'],['Valore RCT',['val_RCT'],'euro'],['Valore fossa',['val_fossa'],'euro'],['Data decorrenza fossa',['data decorrenza fossa'],'excel']]},
 {title:'Commerciale',sub:'Vendita ed esazione',icon:'commercial',fields:[['Codice venditore',['venditore']],['Venditore',['venditore1']],['Esattore cliente',['esattore cl']],['Esattore amministratore',['esattore am']],['Esattore',['esattore1']],['Manutenzione precedente',['TCODMANUT_PREC1']],['Canone precedente 1',['TCANONE_PREC1'],'euro'],['Canone precedente 2',['TCANONE_PREC2'],'euro'],['Canone precedente 3',['TCANONE_PREC3'],'euro']]},
 {title:'Dati fiscali',sub:'Riferimenti tributari',icon:'fiscal',fields:[['Codice fiscale',['PCCODFISCALE']],['Partita IVA',['PCPARTITAIVA']]]}
];
function formatBy(type,v){if(type==='excel')return excelDate(v);if(type==='compact')return compactDate(v);if(type==='euro')return euro(v);if(type==='yesno')return yesNo(v);return display(v)}
function row(label,aliases,type){const k=keyOf(aliases);let v=null;if(k!==null){used.add(k);v=data[k]}const value=formatBy(type,v);const r=document.createElement('div');r.className='row';const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');if(value===EMPTY)dd.className='empty';if(type==='email'&&value!==EMPTY){const a=document.createElement('a');a.href=`mailto:${value}`;a.textContent=value;dd.appendChild(a)}else if(type==='phone'&&value!==EMPTY){const a=document.createElement('a');a.href=`tel:${String(v).replace(/\s/g,'')}`;a.textContent=value;dd.appendChild(a)}else dd.textContent=value;r.append(dt,dd);return r}
function card(section,wide=false){const c=document.createElement('section');c.className='card'+(wide?' wide':'');c.innerHTML=`<header class="card-header"><div class="card-icon">${icons[section.icon]}</div><div><h2>${section.title}</h2><p>${section.sub}</p></div></header>`;const dl=document.createElement('dl');dl.className='fields';section.fields.forEach(f=>dl.appendChild(row(f[0],f[1],f[2])));c.appendChild(dl);return c}
function noteCard(title,value){if(empty(value))return null;const c=document.createElement('section');c.className='card wide';c.innerHTML=`<header class="card-header"><div class="card-icon">${icons.note}</div><div><h2>${title}</h2><p>Annotazioni disponibili per l’impianto</p></div></header>`;const n=document.createElement('div');n.className='note';n.textContent=String(value).trim();c.appendChild(n);return c}
function otherCard(){const keys=Object.keys(data).filter(k=>!used.has(k));if(!keys.length)return null;const c=document.createElement('section');c.className='card wide';c.innerHTML=`<header class="card-header"><div class="card-icon">${icons.other}</div><div><h2>Altre informazioni</h2><p>Campi aggiuntivi ricevuti dal collegamento</p></div></header>`;const dl=document.createElement('dl');dl.className='fields';keys.forEach(k=>{used.add(k);dl.appendChild(row(k.replace(/\s+/g,' ').trim(),[k]))});c.appendChild(dl);return c}
function set(id,v){document.getElementById(id).textContent=display(v)}
function parse(){const p=new URLSearchParams(location.search).get('impianto');if(!p)throw new Error('Nel collegamento manca il parametro “impianto”.');for(const candidate of [p,(()=>{try{return decodeURIComponent(p)}catch{return p}})()]){try{const o=JSON.parse(candidate);if(o&&typeof o==='object'&&!Array.isArray(o))return o}catch{}}throw new Error('Il parametro “impianto” non contiene dati JSON validi.')}
function render(){data=parse();buildMap();const imp=raw(['impianto']),address=raw(['Indirizzo impianto']),city=raw(['Località impianto']),prov=raw(['Prov']),type=raw(['tipo impianto']),tech=raw(['tecnico']),contract=raw(['contratto']);set('title',`Impianto ${display(imp)}`);set('subtitle',[display(address),display(city),display(prov)!==EMPTY?`(${display(prov)})`:null].filter(x=>x&&x!==EMPTY).join(' · '));set('factImpianto',imp);set('factTipo',type);set('factTecnico',tech);set('factContratto',contract);document.title=`Impianto ${display(imp)}`;document.getElementById('emailButton').href=`mailto:?subject=${encodeURIComponent([display(imp),display(address),display(city)].filter(x=>x!==EMPTY).join(' - '))}`;
 const interventions=getInterventiForImpianto(imp),count=interventions.length;document.getElementById('interventiCount').textContent=count;document.getElementById('interventiLinkContainer').innerHTML=count?`<a class="interventions-link" target="_blank" href="interventi.html?impianto=${encodeURIComponent(imp)}">Visualizza tutti →</a>`:`<span class="disabled">Nessun intervento registrato</span>`;
 const cards=document.getElementById('cards');sections.slice(0,2).forEach(s=>cards.appendChild(card(s)));sections.slice(2,4).forEach(s=>cards.appendChild(card(s)));sections.slice(4).forEach(s=>cards.appendChild(card(s)));
 const combinatorType=raw(['tipo']),combinatorValue=raw(['valore']);const isRad=String(combinatorType??'').trim().toUpperCase()==='RAD';const comb={title:'Combinatore telefonico',sub:'Presenza e valore associato',icon:'radio',fields:[['Stato',['tipo'],'status'],['Tipo',['tipo']],['Valore',['valore']]]};const combCard=card(comb,true);const first=combCard.querySelector('.row dd');first.innerHTML=`<span class="tag${isRad?'':' no'}">${isRad?'Presente':'Non presente'}</span>`;cards.appendChild(combCard);
 const noteKey=keyOf(['note']);if(noteKey!==null){used.add(noteKey);const n=noteCard('Note impianto',data[noteKey]);if(n)cards.appendChild(n)}const oa=otherCard();if(oa)cards.appendChild(oa);document.getElementById('content').hidden=false}
try{render()}catch(e){document.getElementById('errorText').textContent=e.message||'Errore durante il caricamento.';document.getElementById('error').style.display='block'}
</script>
</body>
</html>
