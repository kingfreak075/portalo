<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Commessa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           STILE DESKTOP - Dettaglio Commessa (una colonna)
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1b5e20;
            --primary-light: #4caf50;
            --primary-dark: #0d3b12;
            --primary-bg: #e8f5e9;
            --success: #2e7d32;
            --danger: #d32f2f;
            --warning: #f57c00;
            --info: #1976d2;
            --text-primary: #1a2332;
            --text-secondary: #4a5568;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 4px 20px rgba(46, 125, 50, 0.12);
            --shadow-lg: 0 8px 40px rgba(46, 125, 50, 0.18);
            --shadow-hover: 0 12px 48px rgba(46, 125, 50, 0.22);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --bg-start: #a5d6a7;
            --bg-end: #66bb6a;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --header-height: 60px;
        }

        /* Dark Theme */
        body.dark-theme {
            --bg-start: #0f1724;
            --bg-end: #1a2332;
            --card-bg: rgba(26, 35, 50, 0.95);
            --text-primary: #e8edf5;
            --text-secondary: #b0c4de;
            --text-muted: #7a8ba3;
            --border-color: rgba(76, 175, 80, 0.15);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
            --primary-bg: rgba(76, 175, 80, 0.12);
        }

        body.dark-theme .container {
            background: var(--card-bg);
            border-color: var(--border-color);
        }

        body.dark-theme .card {
            background: rgba(40, 50, 65, 0.6);
            border-color: var(--border-color);
        }

        body.dark-theme .card-title {
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        body.dark-theme .field {
            border-color: var(--border-color);
        }

        body.dark-theme .field .label {
            color: var(--text-muted);
        }

        body.dark-theme .field .value {
            color: var(--text-primary);
        }

        body.dark-theme .back-btn {
            background: rgba(76, 175, 80, 0.15);
            color: var(--text-secondary);
        }

        body.dark-theme .back-btn:hover {
            background: var(--primary-light);
            color: white;
        }

        body.dark-theme .status-C {
            background: #1b5e20;
            color: #a5d6a7;
        }
        body.dark-theme .status-A {
            background: #c62828;
            color: #ef9a9a;
        }
        body.dark-theme .status-P {
            background: #e65100;
            color: #ffcc80;
        }

        body.dark-theme .success-message {
            background: rgba(27, 94, 32, 0.2);
            color: #81c784;
        }

        body.dark-theme .json-display {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        body.dark-theme .error-state {
            border-color: var(--danger);
        }

        body.dark-theme .error-state h3 {
            color: var(--text-secondary);
        }

        body.dark-theme .loading-state p {
            color: var(--text-muted);
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
            line-height: 1.6;
            transition: background var(--transition);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 28px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: all var(--transition);
        }

        .container:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ----- HEADER ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 8px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-light);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-left h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.3px;
            margin: 0;
        }

        .header-left h1::before {
            content: "📋 ";
        }

        .header-left .badge {
            background: var(--primary-bg);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-actions button {
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: var(--font);
            color: var(--text-secondary);
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions button:hover {
            background: var(--primary-light);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.15);
        }

        .back-btn {
            text-decoration: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: var(--font);
            color: var(--text-secondary);
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: var(--primary-light);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.15);
            text-decoration: none;
        }

        /* ----- SUBHEADER ----- */
        .subheader {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding: 4px 0;
        }

        /* ----- CONTENUTO ----- */
        .content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ----- CARD ----- */
        .card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 1px 3px var(--shadow);
            transition: all var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow);
        }

        .card-title {
            padding: 12px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.02);
        }

        .card-body {
            padding: 14px 18px;
        }

        /* ----- FIELD ----- */
        .field {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .field:last-child {
            border-bottom: none;
        }

        .field .label {
            font-weight: 500;
            color: var(--text-muted);
        }

        .field .value {
            color: var(--text-primary);
            text-align: right;
            max-width: 55%;
            word-break: break-word;
        }

        .field .value strong {
            color: var(--primary);
        }

        .field .value .status-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-C {
            background: #c8e6c9;
            color: #1b5e20;
        }
        .status-A {
            background: #ffcdd2;
            color: #c62828;
        }
        .status-P {
            background: #fff3e0;
            color: #e65100;
        }

        /* ----- JSON DISPLAY ----- */
        .json-display {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 6px;
            padding: 12px 14px;
            font-size: 0.78rem;
            font-family: 'Courier New', monospace;
            color: var(--text-secondary);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        /* ----- SUCCESS MESSAGE ----- */
        .success-message {
            background: var(--primary-bg);
            color: var(--primary);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
            border-left: 4px solid var(--primary-light);
        }

        /* ----- LOADING ----- */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* ----- ERROR ----- */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            border: 1px solid var(--danger);
            border-radius: var(--radius-sm);
        }

        .error-state .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-state h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .error-state p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ----- TOAST ----- */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            font-family: var(--font);
            font-size: 0.9rem;
        }

        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.warning {
            background: var(--warning);
        }
        .toast.info {
            background: var(--info);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        .toast.out {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideOut {
            from {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
            to {
                transform: translateX(100%) scale(0.95);
                opacity: 0;
            }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 18px 16px;
                border-radius: var(--radius-sm);
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header-left h1 {
                font-size: 1.2rem;
            }
            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }
            .header-actions button,
            .back-btn {
                flex: 1;
                justify-content: center;
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .field {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                padding: 8px 0;
            }
            .field .value {
                text-align: left;
                max-width: 100%;
                width: 100%;
            }
            .card-title {
                font-size: 0.85rem;
                padding: 10px 14px;
            }
            .card-body {
                padding: 10px 14px;
            }
            .subheader {
                font-size: 0.85rem;
            }
            .json-display {
                font-size: 0.7rem;
                max-height: 200px;
            }
            .success-message {
                font-size: 0.85rem;
                padding: 10px 14px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 12px 10px;
            }
            .header-left h1 {
                font-size: 1rem;
            }
            .header-left .badge {
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .field {
                font-size: 0.82rem;
            }
            .card-title {
                font-size: 0.8rem;
                padding: 8px 12px;
            }
            .card-body {
                padding: 8px 12px;
            }
            .toast-container {
                left: 16px;
                right: 16px;
                max-width: 100%;
            }
        }

        /* ----- PRINT ----- */
        @media print {
            body {
                padding: 0;
                background: white;
            }
            .container {
                box-shadow: none;
                border: none;
            }
            .header-actions,
            .back-btn {
                display: none;
            }
            .card {
                break-inside: avoid;
                page-break-inside: avoid;
                border-color: #ddd;
            }
            .card:hover {
                transform: none;
                box-shadow: none;
            }
            .json-display {
                max-height: none;
                overflow: visible;
            }
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <h1>Dettaglio Commessa</h1>
                <span class="badge" id="commessaBadge">Caricamento...</span>
            </div>
            <div class="header-actions">
                <button onclick="toggleTheme()" title="Cambia tema">🌓 Tema</button>
                <button onclick="window.print()" title="Stampa">🖨️ Stampa</button>
                <a href="javascript:history.back()" class="back-btn">⬅️ Torna indietro</a>
            </div>
        </div>

        <div class="subheader" id="subheader">Sistema di visualizzazione dati commesse</div>

        <!-- CONTENUTO -->
        <div id="content">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Caricamento dati in corso...</p>
            </div>
        </div>

    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // TEMA
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            localStorage.setItem('commesseTheme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const saved = localStorage.getItem('commesseTheme');
            if (saved === 'dark') {
                document.body.classList.add('dark-theme');
            }
        }
        loadTheme();

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('out');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ============================================================
        // UTILITY
        // ============================================================
        function excelDateToJSDate(excelDate) {
            if (!excelDate) return null;
            if (typeof excelDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(excelDate)) {
                const d = new Date(excelDate);
                if (!isNaN(d)) return d;
            }
            if (typeof excelDate === 'number') {
                const epoch = new Date(1899, 11, 30);
                const d = new Date(epoch.getTime() + excelDate * 86400000);
                if (!isNaN(d)) return d;
            }
            if (typeof excelDate === 'string') {
                const d = new Date(excelDate);
                if (!isNaN(d)) return d;
                const parts = excelDate.split(/[/.-]/);
                if (parts.length === 3) {
                    const day = parseInt(parts[0]);
                    const month = parseInt(parts[1]);
                    const year = parseInt(parts[2]);
                    if (!isNaN(day) && !isNaN(month) && !isNaN(year) && year > 2000) {
                        const d = new Date(year, month - 1, day);
                        if (!isNaN(d)) return d;
                    }
                }
            }
            return null;
        }

        function formatExcelDate(excelDate) {
            if (!excelDate || excelDate === 0 || excelDate === '') return 'N/A';
            const d = excelDateToJSDate(excelDate);
            if (!d || isNaN(d)) return 'N/A';
            return d.toLocaleDateString('it-IT');
        }

        function formatCurrency(amount) {
            if (amount === undefined || amount === null || amount === '') return 'N/A';
            const num = parseFloat(amount);
            if (isNaN(num)) return 'N/A';
            return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(num);
        }

        function getFieldValue(obj, key, defaultValue = 'N/A') {
            if (!obj) return defaultValue;
            const value = obj[key];
            return (value !== undefined && value !== null && value !== '') ? value : defaultValue;
        }

        // ============================================================
        // CARICAMENTO DATI
        // ============================================================
        function loadCommessa() {
            const urlParams = new URLSearchParams(window.location.search);
            const commessaParam = urlParams.get('commessa');

            const contentDiv = document.getElementById('content');
            const badgeEl = document.getElementById('commessaBadge');

            if (!commessaParam) {
                contentDiv.innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">⚠️</div>
                        <h3>Nessuna commessa selezionata</h3>
                        <p>Specificare una commessa nella URL: <code>?commessa=...</code></p>
                    </div>
                `;
                badgeEl.textContent = '⚠️ Non selezionata';
                document.querySelector('.header-left h1').textContent = '📋 Nessuna Commessa';
                return;
            }

            try {
                const data = JSON.parse(decodeURIComponent(commessaParam));

                const numero = data['Numero Commessa'] || 'N/D';
                badgeEl.textContent = `🆔 ${numero}`;
                document.querySelector('.header-left h1').textContent = `📋 Commessa ${numero}`;
                document.title = `Commessa ${numero}`;

                const stato = data['Stato comm.'];
                let statoBadge = '';
                if (stato) {
                    let cls = 'status-P';
                    if (stato === 'C') cls = 'status-C';
                    else if (stato === 'A') cls = 'status-A';
                    statoBadge = `<span class="status-badge ${cls}">${stato}</span>`;
                }

                // Costruisce HTML
                let html = '';

                // Success message
                html += `
                    <div class="success-message">✅ Commessa ${numero} caricata con successo</div>
                `;

                // Card 1: Informazioni Principali
                html += `
                    <div class="card">
                        <div class="card-title">📌 Informazioni Principali</div>
                        <div class="card-body">
                            <div class="field">
                                <span class="label">Numero Commessa</span>
                                <span class="value"><strong>${getFieldValue(data, 'Numero Commessa')}</strong></span>
                            </div>
                            <div class="field">
                                <span class="label">Data commessa</span>
                                <span class="value">${formatExcelDate(data['Data commessa'])}</span>
                            </div>
                            <div class="field">
                                <span class="label">Stato comm.</span>
                                <span class="value">${statoBadge || 'N/A'}</span>
                            </div>
                            <div class="field">
                                <span class="label">Tipo</span>
                                <span class="value">${getFieldValue(data, 'Tipo')}</span>
                            </div>
                            <div class="field" style="border-bottom:none;">
                                <span class="label">ID Imp.</span>
                                <span class="value"><strong>${getFieldValue(data, 'ID Imp.')}</strong></span>
                            </div>
                        </div>
                    </div>
                `;

                // Card 2: Dettagli Impianto
                if (data.Indirizzo || data['Località impianto'] || data.Prov) {
                    html += `
                        <div class="card">
                            <div class="card-title">📍 Dettagli Impianto</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Indirizzo</span>
                                    <span class="value">${getFieldValue(data, 'Indirizzo')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Località impianto</span>
                                    <span class="value">${getFieldValue(data, 'Località impianto')}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">Prov.</span>
                                    <span class="value">${getFieldValue(data, 'Prov')}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 3: Informazioni Commerciali
                if (data['Addetto commerciale'] || data['Prezzo Netto']) {
                    html += `
                        <div class="card">
                            <div class="card-title">💰 Informazioni Commerciali</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Addetto commerciale</span>
                                    <span class="value">${getFieldValue(data, 'Addetto commerciale')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Descrizione Lavori</span>
                                    <span class="value">${getFieldValue(data, 'Descrizione Lavori')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Prezzo Netto</span>
                                    <span class="value"><strong>${formatCurrency(data['Prezzo Netto'])}</strong></span>
                                </div>
                                <div class="field">
                                    <span class="label">N. ordine</span>
                                    <span class="value">${getFieldValue(data, 'N. ordine')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Data Ordine</span>
                                    <span class="value">${formatExcelDate(data['Data Ordine'])}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">Costo materiale</span>
                                    <span class="value">${formatCurrency(data['Costo materiale'])}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 4: Pianificazione
                if (data['Data inizio lavori prevista'] || data['Data fine lavori prevista']) {
                    html += `
                        <div class="card">
                            <div class="card-title">📅 Pianificazione Lavori</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Data inizio lavori prevista</span>
                                    <span class="value">${formatExcelDate(data['Data inizio lavori prevista'])}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Data fine lavori prevista</span>
                                    <span class="value">${formatExcelDate(data['Data fine lavori prevista'])}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Pianificato / Completato nel mese</span>
                                    <span class="value">${getFieldValue(data, 'Pianificato / Completato nel mese')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Data effettiva chiusura commessa</span>
                                    <span class="value">${formatExcelDate(data['Data effettiva chiusura commessa'])}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">Data validazione commessa</span>
                                    <span class="value">${formatExcelDate(data['Data validazione commessa'])}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 5: Altri Dettagli
                if (data['Supervisore STF'] || data.NOTE) {
                    html += `
                        <div class="card">
                            <div class="card-title">📝 Altri Dettagli</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Supervisore STF</span>
                                    <span class="value">${getFieldValue(data, 'Supervisore STF')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Subappalto</span>
                                    <span class="value">${getFieldValue(data, 'Subappalto Si o No')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Risorsa/e</span>
                                    <span class="value">${getFieldValue(data, 'Risorsa/e (interna o esterna)')}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">NOTE</span>
                                    <span class="value" style="max-width:50%;">${getFieldValue(data, 'NOTE')}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 6: Dati JSON
                html += `
                    <div class="card">
                        <div class="card-title">📋 Dati JSON Completi</div>
                        <div class="card-body">
                            <div class="json-display">${JSON.stringify(data, null, 2)}</div>
                        </div>
                    </div>
                `;

                contentDiv.innerHTML = html;

            } catch (error) {
                console.error('Errore:', error);
                contentDiv.innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">❌</div>
                        <h3>Errore nel caricamento</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                badgeEl.textContent = '❌ Errore';
                showToast('❌ Errore caricamento commessa', 'error');
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadCommessa);

        console.log('📱 Commesse Desktop v1.0');
    </script>

</body>
</html>
