<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dettaglio Commessa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           iOS NATIVE STYLE - Commesse Mobile
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --ios-blue: #007AFF;
            --ios-blue-dark: #0055CC;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --ios-yellow: #FFCC00;
            --ios-gray: #8E8E93;
            --ios-gray-light: #C7C7CC;
            --ios-gray-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-text: #000000;
            --ios-text-secondary: #3C3C43;
            --ios-text-tertiary: #8E8E93;
            --ios-separator: #E5E5EA;
            --ios-shadow: rgba(0, 0, 0, 0.08);
            --ios-shadow-heavy: rgba(0, 0, 0, 0.15);
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --tab-height: 50px;
            --header-height: 52px;
        }

        body.dark {
            --ios-gray-bg: #000000;
            --ios-card: #1C1C1E;
            --ios-text: #FFFFFF;
            --ios-text-secondary: #EBEBF5;
            --ios-text-tertiary: #8E8E93;
            --ios-separator: #38383A;
            --ios-shadow: rgba(255, 255, 255, 0.05);
            --ios-shadow-heavy: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background: var(--ios-gray-bg);
            color: var(--ios-text);
            min-height: 100vh;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 8px);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ----- HEADER ----- */
        .header {
            background: var(--ios-card);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 0.5px solid var(--ios-separator);
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: var(--header-height);
            transition: background 0.3s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header-back {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--ios-blue);
            padding: 4px;
            transition: transform 0.15s ease;
        }

        .header-back:active {
            transform: scale(0.85);
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--ios-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-actions button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            color: var(--ios-blue);
            transition: transform 0.15s ease;
        }

        .header-actions button:active {
            transform: scale(0.85);
        }

        /* ----- CONTENT ----- */
        .content {
            padding: 16px;
        }

        /* ----- CARD ----- */
        .card {
            background: var(--ios-card);
            border-radius: 14px;
            border: 0.5px solid var(--ios-separator);
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: 0 1px 3px var(--ios-shadow);
            transition: background 0.3s ease;
        }

        .card-title {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 15px;
            color: var(--ios-text);
            border-bottom: 0.5px solid var(--ios-separator);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-body {
            padding: 12px 16px;
        }

        /* ----- FIELD ----- */
        .field {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 0.5px solid var(--ios-separator);
            font-size: 14px;
        }

        .field:last-child {
            border-bottom: none;
        }

        .field .label {
            font-weight: 500;
            color: var(--ios-text-tertiary);
        }

        .field .value {
            color: var(--ios-text);
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        .field .value strong {
            color: var(--ios-text);
        }

        /* ----- STATUS BADGE ----- */
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-C {
            background: #C8E6C9;
            color: #1B5E20;
        }

        .status-A {
            background: #FFCDD2;
            color: #C62828;
        }

        .status-P {
            background: #FFF3E0;
            color: #E65100;
        }

        body.dark .status-C {
            background: #1B5E20;
            color: #A5D6A7;
        }
        body.dark .status-A {
            background: #C62828;
            color: #EF9A9A;
        }
        body.dark .status-P {
            background: #E65100;
            color: #FFCC80;
        }

        /* ----- JSON ----- */
        .json-display {
            background: var(--ios-gray-bg);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            color: var(--ios-text-secondary);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        /* ----- LOADING ----- */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--ios-separator);
            border-top: 3px solid var(--ios-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: var(--ios-text-tertiary);
            font-size: 15px;
        }

        /* ----- ERROR ----- */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-state .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-state h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--ios-text-secondary);
            margin-bottom: 4px;
        }

        .error-state p {
            color: var(--ios-text-tertiary);
            font-size: 15px;
        }

        /* ----- SUCCESS ----- */
        .success-message {
            background: var(--ios-green);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
        }

        /* ----- BOTTOM NAV ----- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--tab-height) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: var(--ios-card);
            border-top: 0.5px solid var(--ios-separator);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 300;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: background 0.3s ease;
        }

        .bottom-nav button {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 4px 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: 500;
            color: var(--ios-text-tertiary);
            transition: color 0.2s;
            min-width: 44px;
            min-height: 44px;
            justify-content: center;
        }

        .bottom-nav button .nav-icon {
            font-size: 22px;
            line-height: 1;
        }

        .bottom-nav button .nav-label {
            font-size: 10px;
            letter-spacing: 0.2px;
        }

        .bottom-nav button.active {
            color: var(--ios-blue);
        }

        .bottom-nav button:active {
            transform: scale(0.9);
        }

        /* ----- TOAST ----- */
        .toast-container {
            position: fixed;
            top: calc(var(--safe-top) + 60px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            pointer-events: none;
            max-width: 90%;
        }

        .toast {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: toastIn 0.3s ease;
            text-align: center;
            pointer-events: auto;
            min-width: 120px;
        }

        .toast.out {
            animation: toastOut 0.3s ease forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 375px) {
            .header-title {
                font-size: 15px;
            }
            .field {
                font-size: 13px;
            }
            .card-title {
                font-size: 14px;
            }
        }

        @media (min-width: 768px) {
            body {
                background: var(--ios-gray-bg);
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding: 40px 20px;
            }
            .container {
                max-width: 430px;
                margin: 0 auto;
                background: var(--ios-gray-bg);
                border-radius: 20px;
                box-shadow: 0 20px 60px var(--ios-shadow-heavy);
                overflow: hidden;
                border: 0.5px solid var(--ios-separator);
                min-height: 90vh;
            }
            body.dark {
                background: #000000;
            }
        }

        /* ----- PRINT ----- */
        @media print {
            .header-actions,
            .bottom-nav {
                display: none;
            }
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border: none;
            }
            .card {
                break-inside: avoid;
                page-break-inside: avoid;
                border-color: #ddd;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <button class="header-back" onclick="goBack()">‹</button>
                <span class="header-title" id="headerTitle">Dettaglio Commessa</span>
            </div>
            <div class="header-actions">
                <button onclick="toggleTheme()" aria-label="Tema" title="Tema">🌓</button>
                <button onclick="window.print()" aria-label="Stampa" title="Stampa">🖨️</button>
            </div>
        </header>

        <!-- ===== CONTENUTO ===== -->
        <div class="content" id="content">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Caricamento dati...</p>
            </div>
        </div>

        <!-- ===== BOTTOM NAV ===== -->
        <nav class="bottom-nav">
            <button onclick="goHome()">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </button>
            <button onclick="goSearch()">
                <span class="nav-icon">🔍</span>
                <span class="nav-label">Cerca</span>
            </button>
            <button class="active">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Commessa</span>
            </button>
            <button onclick="toggleTheme()">
                <span class="nav-icon" id="themeIcon">🌓</span>
                <span class="nav-label">Tema</span>
            </button>
        </nav>

        <!-- ===== TOAST ===== -->
        <div class="toast-container" id="toastContainer"></div>

    </div>

    <script>
        // ============================================================
        // TEMA
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌓';
        }

        function loadTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
            }
            document.getElementById('themeIcon').textContent = document.body.classList.contains('dark') ? '☀️' : '🌓';
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('out');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function goBack() {
            if (document.referrer && document.referrer.includes('ricerca_m')) {
                window.location.href = 'ricerca_m.html';
            } else {
                window.history.back();
            }
        }

        function goHome() {
            window.location.href = 'ricerca_m.html';
        }

        function goSearch() {
            window.location.href = 'ricerca_m.html';
        }

        // ============================================================
        // UTILITY
        // ============================================================
        function excelDateToJSDate(excelDate) {
            if (!excelDate) return null;
            if (typeof excelDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(excelDate)) {
                const d = new Date(excelDate);
                if (!isNaN(d)) return d;
            }
            if (typeof excelDate === 'number') {
                const epoch = new Date(1899, 11, 30);
                const d = new Date(epoch.getTime() + excelDate * 86400000);
                if (!isNaN(d)) return d;
            }
            if (typeof excelDate === 'string') {
                const d = new Date(excelDate);
                if (!isNaN(d)) return d;
                const parts = excelDate.split(/[/.-]/);
                if (parts.length === 3) {
                    const day = parseInt(parts[0]);
                    const month = parseInt(parts[1]);
                    const year = parseInt(parts[2]);
                    if (!isNaN(day) && !isNaN(month) && !isNaN(year) && year > 2000) {
                        const d = new Date(year, month - 1, day);
                        if (!isNaN(d)) return d;
                    }
                }
            }
            return null;
        }

        function formatExcelDate(excelDate) {
            if (!excelDate || excelDate === 0 || excelDate === '') return 'N/A';
            const d = excelDateToJSDate(excelDate);
            if (!d || isNaN(d)) return 'N/A';
            return d.toLocaleDateString('it-IT');
        }

        function formatCurrency(amount) {
            if (amount === undefined || amount === null || amount === '') return 'N/A';
            const num = parseFloat(amount);
            if (isNaN(num)) return 'N/A';
            return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(num);
        }

        function getFieldValue(obj, key, defaultValue = 'N/A') {
            if (!obj) return defaultValue;
            const value = obj[key];
            return (value !== undefined && value !== null && value !== '') ? value : defaultValue;
        }

        // ============================================================
        // CARICAMENTO DATI
        // ============================================================
        function loadCommessa() {
            const urlParams = new URLSearchParams(window.location.search);
            const commessaParam = urlParams.get('commessa');

            if (!commessaParam) {
                document.getElementById('content').innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">⚠️</div>
                        <h3>Nessuna commessa selezionata</h3>
                        <p>Specificare una commessa nella URL: ?commessa=...</p>
                    </div>
                `;
                document.getElementById('headerTitle').textContent = 'Nessuna Commessa';
                return;
            }

            try {
                const data = JSON.parse(decodeURIComponent(commessaParam));

                const numero = data['Numero Commessa'] || 'N/D';
                document.getElementById('headerTitle').textContent = `Commessa ${numero}`;

                const stato = data['Stato comm.'];
                let statoBadge = '';
                if (stato) {
                    let cls = 'status-P';
                    if (stato === 'C') cls = 'status-C';
                    else if (stato === 'A') cls = 'status-A';
                    statoBadge = `<span class="status-badge ${cls}">${stato}</span>`;
                }

                // Costruisce HTML
                let html = '';

                // Success message
                html += `
                    <div class="success-message">✅ Commessa ${numero} caricata con successo</div>
                `;

                // Card 1: Informazioni Principali
                html += `
                    <div class="card">
                        <div class="card-title">📌 Informazioni Principali</div>
                        <div class="card-body">
                            <div class="field">
                                <span class="label">Numero Commessa</span>
                                <span class="value"><strong>${getFieldValue(data, 'Numero Commessa')}</strong></span>
                            </div>
                            <div class="field">
                                <span class="label">Data commessa</span>
                                <span class="value">${formatExcelDate(data['Data commessa'])}</span>
                            </div>
                            <div class="field">
                                <span class="label">Stato comm.</span>
                                <span class="value">${statoBadge || 'N/A'}</span>
                            </div>
                            <div class="field">
                                <span class="label">Tipo</span>
                                <span class="value">${getFieldValue(data, 'Tipo')}</span>
                            </div>
                            <div class="field" style="border-bottom:none;">
                                <span class="label">ID Imp.</span>
                                <span class="value"><strong>${getFieldValue(data, 'ID Imp.')}</strong></span>
                            </div>
                        </div>
                    </div>
                `;

                // Card 2: Dettagli Impianto
                if (data.Indirizzo || data['Località impianto'] || data.Prov) {
                    html += `
                        <div class="card">
                            <div class="card-title">📍 Dettagli Impianto</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Indirizzo</span>
                                    <span class="value">${getFieldValue(data, 'Indirizzo')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Località impianto</span>
                                    <span class="value">${getFieldValue(data, 'Località impianto')}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">Prov.</span>
                                    <span class="value">${getFieldValue(data, 'Prov')}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 3: Informazioni Commerciali
                if (data['Addetto commerciale'] || data['Prezzo Netto']) {
                    html += `
                        <div class="card">
                            <div class="card-title">💰 Informazioni Commerciali</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Addetto commerciale</span>
                                    <span class="value">${getFieldValue(data, 'Addetto commerciale')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Descrizione Lavori</span>
                                    <span class="value">${getFieldValue(data, 'Descrizione Lavori')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Prezzo Netto</span>
                                    <span class="value"><strong>${formatCurrency(data['Prezzo Netto'])}</strong></span>
                                </div>
                                <div class="field">
                                    <span class="label">N. ordine</span>
                                    <span class="value">${getFieldValue(data, 'N. ordine')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Data Ordine</span>
                                    <span class="value">${formatExcelDate(data['Data Ordine'])}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">Costo materiale</span>
                                    <span class="value">${formatCurrency(data['Costo materiale'])}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 4: Pianificazione
                if (data['Data inizio lavori prevista'] || data['Data fine lavori prevista']) {
                    html += `
                        <div class="card">
                            <div class="card-title">📅 Pianificazione Lavori</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Data inizio lavori prevista</span>
                                    <span class="value">${formatExcelDate(data['Data inizio lavori prevista'])}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Data fine lavori prevista</span>
                                    <span class="value">${formatExcelDate(data['Data fine lavori prevista'])}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Pianificato / Completato nel mese</span>
                                    <span class="value">${getFieldValue(data, 'Pianificato / Completato nel mese')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Data effettiva chiusura commessa</span>
                                    <span class="value">${formatExcelDate(data['Data effettiva chiusura commessa'])}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">Data validazione commessa</span>
                                    <span class="value">${formatExcelDate(data['Data validazione commessa'])}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 5: Altri Dettagli
                if (data['Supervisore STF'] || data.NOTE) {
                    html += `
                        <div class="card">
                            <div class="card-title">📝 Altri Dettagli</div>
                            <div class="card-body">
                                <div class="field">
                                    <span class="label">Supervisore STF</span>
                                    <span class="value">${getFieldValue(data, 'Supervisore STF')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Subappalto</span>
                                    <span class="value">${getFieldValue(data, 'Subappalto Si o No')}</span>
                                </div>
                                <div class="field">
                                    <span class="label">Risorsa/e</span>
                                    <span class="value">${getFieldValue(data, 'Risorsa/e (interna o esterna)')}</span>
                                </div>
                                <div class="field" style="border-bottom:none;">
                                    <span class="label">NOTE</span>
                                    <span class="value" style="max-width:50%;">${getFieldValue(data, 'NOTE')}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Card 6: Dati JSON
                html += `
                    <div class="card">
                        <div class="card-title">📋 Dati JSON Completi</div>
                        <div class="card-body">
                            <div class="json-display">${JSON.stringify(data, null, 2)}</div>
                        </div>
                    </div>
                `;

                document.getElementById('content').innerHTML = html;

            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">❌</div>
                        <h3>Errore nel caricamento</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                showToast('❌ Errore caricamento commessa', 'error');
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        loadTheme();
        loadCommessa();

        console.log('📱 Commesse Mobile v1.0');
    </script>
